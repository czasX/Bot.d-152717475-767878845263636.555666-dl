name: NexusBot Production Runner

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install discord.py requests
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Verify Token and Start Bot
        env:
          TOKEN: ${{ secrets.TOKEN }}
        run: |
          # Kiểm tra xem GitHub Secret 'TOKEN' đã được nhận chưa (ẩn ký tự bảo mật)
          if [ -z "$TOKEN" ]; then
            echo "Error: Biến TOKEN chưa được cấu hình trong GitHub Secrets!"
            exit 1
          else
            echo "Token đã được tải thành công từ Secrets."
          fi
          
          # Thực thi bot Python
          python3 RoleMembersAuto.py
          
